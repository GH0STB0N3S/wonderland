  const ws2=AC.createBufferSource(); ws2.buffer=wb2; ws2.loop=true; const wf2=AC.createBiquadFilter(); wf2.type='lowpass'; wf2.frequency.value=500; whoosh=AC.createGain(); whoosh.gain.value=0; ws2.connect(wf2); wf2.connect(whoosh); whoosh.connect(master); ws2.start(); whooshF=wf2;
  chordT=AC.currentTime; noteT=AC.currentTime+.6; try{ const sb=AC.createBuffer(1,1,22050), sn=AC.createBufferSource(); sn.buffer=sb; sn.connect(AC.destination); sn.start(0); }catch(e){}
}
function ep(m,t,vol){ const f=mtof(m); const o=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain(), fl=AC.createBiquadFilter(); o.type='sine'; o2.type='sine'; o.frequency.value=f; o2.frequency.value=f*2.001; const g2=AC.createGain(); g2.gain.value=.18; fl.type='lowpass'; fl.frequency.value=2200;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+2.6); o.connect(g); o2.connect(g2); g2.connect(g); g.connect(fl); fl.connect(master); fl.connect(verbN); fl.connect(delN); o.start(t); o2.start(t); o.stop(t+2.7); o2.stop(t+2.7); }
function audioTick(speed){
  if(!AC||!padF) return; const t=AC.currentTime; const sn=Math.min(1,speed/3);
  if(whoosh){ whoosh.gain.setTargetAtTime(sn*.07,t,.15); whooshF.frequency.setTargetAtTime(260+sn*700,t,.15); }
  padF.frequency.setTargetAtTime(380+sn*650+(Math.sin(t*.15)+1)*90,t,.4);
  if(t>chordT+8){ chordT=t; chordI=(chordI+1)%CH.length; const c=CH[chordI]; for(let i=0;i<4;i++){ oscs[i*2].frequency.setTargetAtTime(mtof(c[i]),t,1.6); oscs[i*2+1].frequency.setTargetAtTime(mtof(c[i]),t,1.6); } oscs.bass.frequency.setTargetAtTime(mtof(c[0]-24),t,1); }
  if(t>noteT){ const m=PENT[(Math.random()*PENT.length)|0]; ep(m,t+.02,.05); if(Math.random()<.35) ep(PENT[(Math.random()*PENT.length)|0]-12,t+.4,.04); noteT=t+2.2+Math.random()*3.2; }
}
function chime(){ if(!AC||muted) return; const t=AC.currentTime; ep(PENT[(Math.random()*5)|0]+12,t,.035); }
$('mute').addEventListener('click',e=>{ e.stopPropagation(); touchStart(); muted=!muted; $('mute').innerHTML=muted?'&#215;':'&#9835;'; if(master) master.gain.value=muted?0:.7; });
$('mute').addEventListener('pointerdown',e=>e.stopPropagation());
